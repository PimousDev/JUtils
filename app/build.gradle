plugins{
	id "java-library"

	id "jutils"
	id "jutils.ftest"
	id "jutils.jar.libs"
}

description = property("app.description")

dependencies{
	api project(":base")
	api project(":config")
	api project(":i18n")
	api project(":logger")
}

publishing{
	publications{
		maven(MavenPublication){
			from components.java

			pom{
				name = "${projectPrettyName} - App"
				description = project.description
			}
		}
	}
}