plugins{
    id "application"

    id "org.panteleyev.jpackageplugin"
}

tasks.register("prepareJPackage", Copy){
    from(configurations.runtimeClasspath).into(
            layout.buildDirectory.dir("jpackage")
    )
    from(tasks.jar).into(
            layout.buildDirectory.dir("jpackage")
    )
}
tasks.jpackage{
    dependsOn("clean", "build", "prepareJPackage")

    input = layout.buildDirectory.dir("jpackage")
    destination = layout.buildDirectory.dir("distributions")

    appDescription = project.description
    appVersion = project.version
    aboutUrl = property("project.url")

    vendor = property("project.org.name")
    copyright = property("project.org.copyright")

    mainJar = tasks.jar.archiveFileName
    mainClass = application.mainClass

    verbose = true

    linux{
        linuxPackageName = project.name
        linuxAppCategory = project("project.dist.category")
        linuxMenuGroup = project("project.dist.menuGroup")

        linuxDebMaintainer = project("project.org.name")
        linuxRpmLicenseType = project("project.license.name")

        linuxShortcut = true
    }

    windows{
        winHelpUrl = property("project.url")

        winDirChooser = true
        winPerUserInstall = true
        winShortcut = true
        winShortcutPrompt = true
    }
}
