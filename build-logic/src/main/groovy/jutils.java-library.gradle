plugins{
	id("java")
	id("java-library")
}

group = projectGroup
version = projectVersion

sourceSets{
	ftest{
		compileClasspath += main.output
		runtimeClasspath += main.output
	}
}
configurations.ftestImplementation.extendsFrom(
	configurations.testImplementation
)
configurations.ftestRuntimeOnly.extendsFrom(configurations.testRuntimeOnly)

repositories{
	mavenCentral()
}
dependencies{
	compileOnly "org.jetbrains:annotations:26.1.0"

	testImplementation platform("org.junit:junit-bom:5.10.0")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(JavaCompile).configureEach{
	options.compilerArgs.add("-Xlint:all")
	options.compilerArgs.add("-Werror")
	options.deprecation = true
}

tasks.withType(Test).configureEach{
	useJUnitPlatform()
	maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
}
tasks.register("ftest", Test){
	description = "Runs functional tests."
	group = "verification"
	shouldRunAfter test

	testClassesDirs = sourceSets.ftest.output.classesDirs
	classpath = sourceSets.ftest.runtimeClasspath

	useJUnitPlatform()
}
check.dependsOn tasks.ftest

jar{
	doLast{
		copy{
			from jar
			into rootProject.layout.buildDirectory.dir("libs")
		}
	}
}